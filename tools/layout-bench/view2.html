<!doctype html>
<html><head><meta charset="utf-8"><title>Layout viewer 2</title>
<style>
body{font:12px system-ui,sans-serif;margin:8px;background:#fafafa}
#bar button{margin:2px;padding:3px 7px;border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer}
#bar button.on{background:#264;color:#fff}
#panes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pane{background:#fff;border:1px solid #ccc;border-radius:6px;padding:4px}
.pane h3{margin:2px 4px;font-size:13px}.pane .st{color:#555;margin:0 4px 4px}
svg{width:100%;height:var(--h,300px);display:block}
</style></head><body>
<div id="bar">Engines: <input id="engs" size="60" value="compact,fix,podhl"> <button id="go">Run</button><div id="models"></div></div>
<div id="panes"></div>
<script>window.OURS=null;</script>
<script src="base_layout.js"></script>
<script src="models.js"></script>
<script src="models2.js"></script>
<script src="models3.js"></script>
<script src="models4.js"></script>
<script src="engines2.js"></script>
<script>
const cv=document.createElement('canvas').getContext('2d'); cv.font='12px system-ui,sans-serif';
const dimsOf=(labels)=>labels.map(l=>({w:cv.measureText(l).width+10,h:20}));
let cur=new URLSearchParams(location.search).get('m')||'uni';
if(new URLSearchParams(location.search).get('e')) document.getElementById('engs').value=new URLSearchParams(location.search).get('e');
const ENG=Object.assign({compact:(a,b,o)=>window.OURS.compact(a,b,o),grouped:(a,b,o)=>window.OURS.layout(a,b,o)},EXP.engines(window.OURS));
function draw(M,D,P,title,stat){
  const pane=document.createElement('div'); pane.className='pane';
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9; P.forEach((p,i)=>{x1=Math.min(x1,p.x-D[i].w/2);x2=Math.max(x2,p.x+D[i].w/2);y1=Math.min(y1,p.y-D[i].h/2);y2=Math.max(y2,p.y+D[i].h/2);});
  const pad=20; let s=`<svg viewBox="${x1-pad} ${y1-pad} ${x2-x1+2*pad} ${y2-y1+2*pad}" preserveAspectRatio="xMidYMid meet">`;
  M.edges.forEach(e=>{const a=P[e.s],b=P[e.t]; if(e.s===e.t) return; s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${e.kind==='sub'?'#7a5':'#89a'}" stroke-width="1.3" ${e.kind==='sub'?'':'stroke-dasharray="0"'}/>`;});
  P.forEach((p,i)=>{s+=`<rect x="${p.x-D[i].w/2}" y="${p.y-D[i].h/2}" width="${D[i].w}" height="${D[i].h}" rx="9" fill="#e8f0fb" stroke="#57a"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="12">${M.labels[i]}</text>`;});
  pane.innerHTML=`<h3>${title}</h3><div class="st">${stat}</div>`+s+'</svg>'; document.getElementById('panes').appendChild(pane);
}
async function run(){
  document.querySelectorAll('#models button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));
  const M=await MODELS[cur].load(), D=dimsOf(M.labels), items=D.map(d=>({w:d.w,h:d.h}));
  const edges=M.edges.filter(e=>e.s!==e.t).map(e=>[e.s,e.t,e.kind==='sub'?2:1]), EE=edges.map(([s,t,w])=>({s,t,sub:w===2}));
  document.getElementById('panes').innerHTML='';
  for(const en of document.getElementById('engs').value.split(',').map(s=>s.trim()).filter(Boolean)){
    const t=performance.now(); const r=ENG[en](items,edges,{seed:1}); const ms=performance.now()-t;
    if(!r){draw(M,D,D.map(()=>({x:0,y:0})),en,'null');continue;}
    const m=window.OURS.pmetrics(r.pos,D.map(d=>({w:d.w+6,h:d.h+6})),EE);
    draw(M,D,r.pos,en+(r.algo?' → '+r.algo:''),`crossings ${m.cross} · through classes ${m.thru} · mean link ${m.len.toFixed(0)} · ${ms.toFixed(0)} ms`);
  }
}
Object.entries(MODELS).forEach(([k,m])=>{const b=document.createElement('button');b.textContent=m.name;b.dataset.k=k;b.onclick=()=>{cur=k;run();};document.getElementById('models').appendChild(b);});
document.getElementById('go').onclick=run; run();
</script></body></html>
