<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Playback</title>
<style>
:root { --bg: #f4f3ee; --paper: #fff; --ink: #1d232b; --muted: #5d6673; --rule: #d9d6cc; --accent: #2f6b4f; --box: #eef3fb; --box-line: #6d86b0;
  --sub: #6f9a54; --rel: #8b97a8; --bad: #c43d32; --warn: #c98a12; --new: #e0a100; --name: #4b5563; --name-bg: #fffdf5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15181c; --paper: #1c2026; --ink: #e6e8eb; --muted: #9aa4b1; --rule: #30353d; --accent: #7cc39e;
  --box: #233041; --box-line: #6f8db8; --sub: #8fbf6f; --rel: #6f7b8c; --bad: #ff6f61; --warn: #f0b44a; --new: #ffcc33; --name: #b8c0cc; --name-bg: #22262d; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr auto; }
header, footer { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; background: var(--paper); }
header { border-bottom: 1px solid var(--rule); } footer { border-top: 1px solid var(--rule); }
header h1 { font-size: 15px; margin: 0 8px 0 0; }
select, button, input { font: inherit; font-size: 13px; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); color: var(--ink); }
input[type=number] { width: 64px; } input[type=range] { padding: 0; }
button { cursor: pointer; } button:hover { border-color: var(--accent); } button:disabled { opacity: .45; cursor: default; }
label.tog { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; color: var(--muted); font-size: 13px; }
#status { color: var(--muted); font-size: 12px; }
a { color: var(--accent); }
main { display: grid; grid-template-columns: 1fr 390px; min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; }
#svg { width: 100%; height: 100%; display: block; background: var(--bg); touch-action: none; user-select: none; cursor: grab; }
#caption { position: absolute; left: 12px; top: 10px; max-width: min(560px, calc(100% - 24px)); background: color-mix(in srgb, var(--paper) 90%, transparent); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; pointer-events: none; }
#caption .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
#caption .t { font-weight: 600; }
#caption .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
#counts { position: absolute; right: 12px; top: 10px; background: color-mix(in srgb, var(--paper) 90%, transparent); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); display: grid; grid-template-columns: auto auto; gap: 0 10px; pointer-events: none; }
#counts b { color: var(--ink); text-align: right; }
aside { border-left: 1px solid var(--rule); background: var(--paper); overflow-y: auto; padding: 10px 12px; display: grid; gap: 10px; align-content: start; }
aside h2 { font-size: 13px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
aside h2 small { font-weight: 400; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
td { padding: 3px 4px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
td.n { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; white-space: nowrap; }
tr.group td { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding-top: 9px; border-bottom: 0; }
tr.cur td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
tr.off td.name { opacity: .5; }
td.name { cursor: pointer; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
td input[type=range] { width: 70px; }
#variants { font-size: 12.5px; }
#variants div { padding: 2px 0; }
footer .grp { display: flex; gap: 4px; align-items: center; }
#scrub { position: relative; flex: 1 1 320px; min-width: 200px; height: 28px; border-radius: 6px; overflow: hidden; background: var(--bg); border: 1px solid var(--rule); cursor: pointer; }
#scrub .seg { position: absolute; top: 0; bottom: 0; opacity: .55; }
#scrub .head { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
#time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 92px; }
.link { fill: none; stroke: var(--rel); stroke-width: 1.4; }
.link.sub { stroke: var(--sub); stroke-width: 1.8; }
.link.thru { stroke: var(--bad); stroke-width: 2.2; }
.node rect { fill: var(--box); stroke: var(--box-line); stroke-width: 1; }
.node.moved rect { stroke: var(--new); stroke-width: 2.2; }
.node text { font-size: 11px; fill: var(--ink); pointer-events: none; }
.lname rect { fill: var(--name-bg); stroke: none; opacity: .9; }
.lname text { font-size: 10px; fill: var(--name); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--rule); } }
</style>
</head>
<body>
<header>
  <h1>Layout Playback</h1>
  <select id="graph" title="Graph"></select>
  <select id="algo" title="Layout"><option value="auto">Best Read</option><option value="compact">Tidy Stress</option><option value="grouped">Mycelium</option></select>
  <label class="tog" title="The layouts' random seed">Seed <input type="number" id="seed" value="1" min="1" max="999"></label>
  <span id="status"></span>
  <a id="labLink" href="lab.html" title="Hand-edit this graph in the Layout Lab">Layout Lab ↗</a>
</header>
<main>
  <div id="stage">
    <svg id="svg"></svg>
    <div id="caption"><div class="k" id="cK"></div><div class="t" id="cT"></div><div class="d" id="cD"></div></div>
    <div id="counts"></div>
  </div>
  <aside>
    <h2>Steps <small id="totalInfo"></small></h2>
    <p class="hint"><b>Show</b>: animate the step (unticked, it happens at once). <b>Run</b>: unticked, the layout is redone without that step, so you can see what it adds. The slider gives the step more or less of the playing time. Click a step's name to jump to it.</p>
    <table id="steps"></table>
    <div id="variants"></div>
  </aside>
</main>
<footer>
  <div class="grp">
    <button id="bStart" title="Back to the start (Home)">⏮</button>
    <button id="bPrevStep" title="Previous step (Page Up)">⏪</button>
    <button id="bPrev" title="Previous frame (Left arrow)">◀</button>
    <button id="bPlay" title="Play or pause (Space)" style="min-width:64px">▶ Play</button>
    <button id="bNext" title="Next frame (Right arrow)">▶|</button>
    <button id="bNextStep" title="Next step (Page Down)">⏩</button>
    <button id="bEnd" title="To the end (End)">⏭</button>
  </div>
  <div id="scrub" title="Click or drag to move through the layout"></div>
  <span id="time"></span>
  <label class="tog" title="Playing time of the whole layout at 1×">Length <input type="number" id="dur" value="10" min="2" max="300" step="1"> s</label>
  <label class="tog">Speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>×</label>
  <label class="tog"><input type="checkbox" id="follow" checked> Follow the drawing</label>
  <label class="tog"><input type="checkbox" id="names" checked> Link names</label>
  <label class="tog"><input type="checkbox" id="marks" checked> Mark links through classes</label>
</footer>
<script src="base_layout.js"></script>
<script src="models.js"></script>
<script src="models2.js"></script>
<script src="models3.js"></script>
<script src="models4.js"></script>
<script src="models5.js"></script>
<script src="models6.js"></script>
<script>
// Plays back a layout step by step: the library reports the positions after every step that moves classes (_ogTraced),
// the clean-up records each step it keeps, and the link routing is replayed one step at a time. Frames are spread over
// the playing time by step, and the drawing moves smoothly from frame to frame.
const O = window.OURS, svg = $('svg');
const STEPS = [ // key, group, name, what it does, color, can it be left out (Run)
  ['start', 'Placement', 'Start (Pivot-MDS)', 'Classes start where a quick projection of the graph distances puts them (classes with one link wait aside). The drawing starts five times too large so the next step unfolds it.', '#5b8def', false],
  ['restart', 'Placement', 'Other random starts', 'Small graphs also try random starts; only the start that ends with the fewest crossings is shown.', '#7aa2f7', false],
  ['stress', 'Placement', 'Stress majorization', 'Every pair of classes is pulled toward a distance that matches how many links apart they are, near pairs most. Each frame is one sweep.', '#3d6fd6', false],
  ['separate', 'Placement', 'Overlap removal', 'Boxes that touch are pushed apart.', '#9aa4b1', false],
  ['cross', 'Placement', 'Crossing swaps', 'A class at the end of a crossed link swaps place with another class, or moves beside a neighbor, when that crosses fewer links.', '#c43d32', true],
  ['thru', 'Placement', 'Off-link moves', 'A class with a link running through its box moves off it, never adding a crossing.', '#e0702b', true],
  ['tight', 'Placement', 'Shortening long links', 'Each class is pulled toward its neighbors when its links get shorter and nothing gets worse; then the whole drawing shrinks as far as the boxes allow.', '#8a6fd1', true],
  ['leaves', 'Placement', 'One-link classes placed', 'Classes with one link come back, each beside its neighbor in the direction where its link crosses nothing.', '#2f9d6a', false],
  ['leaffix', 'Placement', 'One-link classes re-placed', 'One-link classes that the moves left too close or on a line are placed again.', '#5fb98a', false],
  ['c-single', 'Clean-up', 'Moves into open space', 'A class in a problem moves into nearby open space (cells with no class and no link) or is nudged.', '#d9822b', true],
  ['c-unit', 'Clean-up', 'Leaf units turned', 'A leaf, leaf chain or leaf triangle hanging off one class is turned, mirrored or resized around it.', '#1f8577', true],
  ['c-spread', 'Clean-up', 'Crowds spread outward', 'Where problems pile up, the region is pushed outward in 8 slices, more toward open space, then repaired; kept only if better.', '#2f5fb3', true],
  ['c-group', 'Clean-up', 'Group moves', 'The classes on one side of a remaining problem move together away from the line, with a few repair moves; kept only if better.', '#b5548c', true],
  ['c-finish', 'Clean-up', 'Final leaf pass', 'A last pass over leaf units and single classes still in a problem.', '#6f9a54', true],
  ['r-arcs', 'Links', 'Parallel links as arcs', 'Two or more links between the same two classes (a link and its reverse, or two relationships) spread into arcs, so none hides another.', '#0e7490', true],
  ['r-loops', 'Links', 'Self-link loops', 'A link from a class to itself becomes a loop on its emptiest corner.', '#0891b2', false],
  ['r-bends', 'Links', 'Bends round obstacles', 'A link that still runs through a class (or crosses others when that pays off) bends round it; one link per frame.', '#be185d', true],
  ['r-ports', 'Links', 'Ports at crowded classes', 'Link ends that would meet a box at nearly the same point are spread along that side, in order.', '#7c3aed', true],
  ['r-names', 'Links', 'Link names placed', 'Each link\'s name goes where on its path it covers no class, no other name and as few links as can be. The graphs carry no names, so they are made up: "has" plus the target class.', '#4b5563', true],
];
const SI = Object.fromEntries(STEPS.map((s, i) => [s[0], i]));
const store = { get(k, d) { try { const v = localStorage.getItem('playback:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('playback:' + k, JSON.stringify(v)); } catch (e) {} } };
const CTL = store.get('ctl', {}); // per step: { show, run, w }
const ctl = (k) => (CTL[k] = CTL[k] || { show: !k.startsWith('variant:'), run: true, w: 1 }); // variants not kept start hidden
const VERBS = ['has', 'relatedTo', 'ownedBy', 'partOf', 'uses'];
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------- graphs ----------
const DEV = ['prov', 'uni', 'hotel', 'org', 'brewery', 'trial', 'telecom', 'sosa', 'crm', 'schema', 'health', 'fibo', 'pizza', 'bio', 'big'];
const DEVN = { prov: 'PROV-O (30)', uni: 'University (14)', hotel: 'Hotel booking (13)', org: 'W3C ORG (15)', brewery: 'Brewery IoT (23)', trial: 'Clinical trial (24)', telecom: 'Telecom network (34)', sosa: 'SOSA/SSN (36)', crm: 'Customer 360 (31)', schema: 'schema.org core (49)', health: 'Clinical record, 3 hubs (53)', fibo: 'FIBO-like loans (59)', pizza: 'Pizza taxonomy (90)', bio: 'Biomedical taxonomy (115)', big: 'Bank (179)' };
const TOO_BIG = new Set(['huge', 'hx_md1200', 'pb_cl', 'sf400']);
const groups = [['Development graphs', DEV.filter((k) => MODELS[k])], ['Other training graphs', Object.keys(MODELS).filter((k) => !DEV.includes(k) && !/^(hx_|pb_)/.test(k) && !TOO_BIG.has(k))],
  ['Unseen: held-out graphs', Object.keys(MODELS).filter((k) => k.startsWith('hx_') && !TOO_BIG.has(k))], ['Unseen: public ontologies and Rome graphs', Object.keys(MODELS).filter((k) => k.startsWith('pb_') && !TOO_BIG.has(k))]];
groups.forEach(([label, keys]) => { const g = document.createElement('optgroup'); g.label = label; keys.forEach((k) => { const o = document.createElement('option'); o.value = k; o.textContent = DEVN[k] || (MODELS[k].name || k).replace(/^Public: /, ''); g.appendChild(o); }); $('graph').appendChild(g); });

// ---------- recording a run ----------
// R = { labels, D, E (with self-links and names), frames: [{ key, P (Float64Array, NaN = not placed yet), routes }], variants }
let R = null;
function recordRun(key, algo, seed) {
  return MODELS[key].load().then((Md) => {
    const labels = Md.labels, D = labels.map((l) => ({ w: String(l).length * 6.6 + 10, h: 20 })), n = D.length;
    const seen = new Map(), E = Md.edges.map((e) => { const sub = e.kind === 'sub'; let name = ''; if (!sub) { const k = e.s + '>' + e.t, i = seen.get(k) || 0; seen.set(k, i + 1); name = VERBS[i % VERBS.length] + labels[e.t]; } return { s: e.s, t: e.t, sub, name }; });
    const edges = E.filter((e) => e.s !== e.t).map((e) => [e.s, e.t, e.sub ? 2 : 1]);
    const skip = {}; ['cross', 'thru', 'tight'].forEach((k) => { if (!ctl(k).run) skip[k] = true; }); O.tune.skip = skip;
    // the sink: one run per variant the layout tries; frames of starts that were not kept are dropped
    const runs = []; let cur = null, rtag = -1, chosen = null;
    const sink = { map: null,
      begin(name, nn, core, leafOf) { cur = { name, frames: [], hidden: new Uint8Array(n), score: null }; leafOf.forEach((p, v) => { if (p >= 0) cur.hidden[v] = 1; }); runs.push(cur); rtag = 0; },
      restart(r) { rtag = r; },
      keepRestart(r) { cur.frames = cur.frames.filter((f) => f.r < 0 || f.r === r); rtag = -1; },
      snap(stage, P, info) { if (!cur) return; if (info && info.v != null) cur.hidden[info.v] = 0;
        const A = new Float64Array(2 * n).fill(NaN), map = sink.map;
        if (map) map.forEach((v, k) => { A[2 * v] = P[k].x; A[2 * v + 1] = P[k].y; });
        else for (let v = 0; v < n; v++) if (!cur.hidden[v]) { A[2 * v] = P[v].x; A[2 * v + 1] = P[v].y; }
        cur.frames.push({ key: stage, P: A, r: rtag }); },
      score(name, s) { if (cur) cur.score = s; },
      chosen(name) { chosen = name; } };
    const items = D.map((d) => ({ w: d.w, h: d.h })), N = D.map((d) => ({ w: d.w + 16, h: d.h + 12 }));
    const t0 = O.now();
    const fn = algo === 'compact' ? O.compact : algo === 'grouped' ? (a, b, c) => O.grouped2(a, b, c) || O.compact(a, b, c) : O.auto;
    const res = O.traced(sink, () => fn(items, edges, { seed }));
    O.tune.skip = {};
    const P = res.pos.map((p) => ({ x: p.x, y: p.y })); O.sep(P, N, 6, 200);
    const frames = [], win = runs.find((r) => r.name === chosen) || runs[runs.length - 1];
    runs.filter((r) => r !== win).forEach((r) => r.frames.forEach((f) => frames.push({ key: 'variant:' + r.name, P: f.P })));
    // the drawing grows out of its center, then the kept variant's steps
    const f0 = win.frames[0]; if (f0) { let cx = 0, cy = 0, c = 0; for (let v = 0; v < n; v++) if (!isNaN(f0.P[2 * v])) { cx += f0.P[2 * v]; cy += f0.P[2 * v + 1]; c++; }
      const Z = new Float64Array(2 * n).fill(NaN); for (let v = 0; v < n; v++) if (!isNaN(f0.P[2 * v])) { Z[2 * v] = cx / c; Z[2 * v + 1] = cy / c; } frames.push({ key: 'start', P: Z }); }
    win.frames.forEach((f) => frames.push({ key: f.key, P: f.P }));
    const flat = (Q) => { const A = new Float64Array(2 * n); Q.forEach((p, v) => { A[2 * v] = p.x; A[2 * v + 1] = p.y; }); return A; };
    frames.push({ key: 'separate', P: flat(P) });
    // the clean-up, as the layouts run it: what is left of 1.5 s, at most 0.5 s (skipped below 0.1 s)
    const budgetMs = Math.min(500, 1500 - (O.now() - t0)), Ec = edges.map(([s, t]) => ({ s, t }));
    let Pc = P;
    const order = ['single', 'unit', 'spread', 'group'].filter((k) => ctl('c-' + k).run);
    if (budgetMs >= 100) {
      const r = O.clocked(() => O.tidy.run(P, items, Ec, { budgetMs, record: true, order, spread: ctl('c-spread').run, groups: ctl('c-group').run, finish: ctl('c-finish').run }));
      let Q = P.map((p) => ({ ...p })), phase = 'single';
      for (const s of r.log) {
        if (s.kind === 'phase') { phase = s.phase; continue; }
        const k = 'c-' + phase;
        if (s.kind === 'move' || s.kind === 'unit' || s.kind === 'spread') {
          if (s.pushed) { const Qp = Q.map((p) => ({ ...p })); s.pushed.forEach(([v, x, y]) => (Qp[v] = { x, y })); frames.push({ key: k, P: flat(Qp) }); }
          s.nodes.forEach((v, i) => (Q[v] = { x: s.to[i][0], y: s.to[i][1] })); frames.push({ key: k, P: flat(Q), moved: s.nodes });
        } else if (s.kind === 'group') { s.after.forEach(([v, x, y]) => (Q[v] = { x, y })); frames.push({ key: k, P: flat(Q), moved: s.after.map((a) => a[0]) }); }
      }
      Pc = r.P.map((p) => ({ x: p.x, y: p.y }));
    }
    // the links, one routing step at a time, on the final positions
    const RE = E.map((e) => [e.s, e.t, e.sub ? 2 : 1, e.name ? e.name.length * 6 + 8 : 0]), FP = flat(Pc), base = { sep: ctl('r-arcs').run ? 24 : 0 };
    const route = (o) => O.route(Pc, D, RE, { ...base, ...o }).routes;
    const r1 = route({ bends: false, ports: 0, labels: false }), r2 = ctl('r-bends').run ? route({ ports: 0, labels: false }) : r1;
    const r3 = ctl('r-ports').run ? route({ bends: ctl('r-bends').run, labels: false }) : r2, r4 = ctl('r-names').run ? route({ bends: ctl('r-bends').run, ports: ctl('r-ports').run ? 3 : 0 }) : r3;
    const noLoop = r1.map((x) => ({ ...x, loop: null })), hasLoops = r1.some((x) => x.loop);
    frames.push({ key: 'r-arcs', P: FP, routes: noLoop });
    if (hasLoops) frames.push({ key: 'r-loops', P: FP, routes: r1 });
    const same = (a, b) => JSON.stringify(a.bends) === JSON.stringify(b.bends);
    let cr = r1.slice(); r2.forEach((x, k) => { if (!same(x, r1[k])) { cr = cr.slice(); cr[k] = x; frames.push({ key: 'r-bends', P: FP, routes: cr }); } });
    frames.push({ key: 'r-ports', P: FP, routes: r3 });
    frames.push({ key: 'r-names', P: FP, routes: r4 });
    return { key, algo, seed, labels, D, E, n, frames, final: r4, variants: runs.map((r) => ({ name: r.name, score: r.score, kept: r === win, frames: r.frames.length })), cleanupMs: budgetMs };
  });
}

// ---------- the timeline ----------
// each frame j > 0 is reached by a transition that belongs to frame j's step; a step's share of the playing time is its
// weight over the sum of weights of the steps shown, split evenly over its transitions
let TL = null; // { at: [time of each frame], total }
function timeline() {
  const F = R.frames, cnt = {}; F.forEach((f, j) => { if (j) cnt[f.key] = (cnt[f.key] || 0) + 1; });
  const keys = Object.keys(cnt), w = (k) => { const c = ctl(k.startsWith('variant:') ? k : k); return c.show ? c.w : 0; };
  const W = keys.reduce((s, k) => s + w(k), 0) || 1, T = +$('dur').value || 10, at = [0];
  for (let j = 1; j < F.length; j++) { const k = F[j].key; at.push(at[j - 1] + T * w(k) / W / cnt[k]); }
  TL = { at, total: at[at.length - 1] || 0.001 };
}
const meta = (k) => k.startsWith('variant:') ? ['variant', 'Variants not kept', `Variant "${k.slice(8)}"`, 'Best Read (and Tidy Stress on small graphs) runs several variants and keeps the best-scoring drawing; this one was not kept.', '#b0b7c3', false] : STEPS[SI[k]];
function frameAt(t) { const at = TL.at; let lo = 0, hi = at.length - 1; if (t >= at[hi]) return [hi, 0]; while (lo < hi - 1) { const m = (lo + hi) >> 1; if (at[m] <= t) lo = m; else hi = m; }
  // several frames at the same time (a step shown at once): the last of them
  while (lo < at.length - 1 && at[lo + 1] <= t) lo++;
  const span = at[lo + 1] - at[lo]; return [lo, span > 0 ? (t - at[lo]) / span : 1]; }

// ---------- drawing ----------
let view = { x: 0, y: 0, w: 1000, h: 700 }, viewT = null, T = 0, playing = false, lastTs = 0, userView = false;
const ease = (u) => u * u * (3 - 2 * u);
function lerpRoute(a, b, u) {
  if (!a && !b) return null; const ra = a || { bends: [], ports: null, loop: null }, rb = b || { bends: [], ports: null, loop: null };
  let bends; const A = ra.bends || [], B = rb.bends || [];
  if (A.length === B.length) bends = B.map((h, i) => ({ t: A[i].t + (h.t - A[i].t) * u, d: A[i].d + (h.d - A[i].d) * u }));
