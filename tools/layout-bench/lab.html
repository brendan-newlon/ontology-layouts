<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout Lab</title>
<!-- The Layout Lab is now playback.html (the layout plays step by step, and you change it there). Old links land here. -->
<script>
{ const q = new URLSearchParams(location.search), keep = new URLSearchParams();
  ['graph', 'algo', 'seed'].forEach((k) => { if (q.get(k)) keep.set(k, q.get(k)); });
  location.replace('playback.html' + (keep.toString() ? '?' + keep : '')); }
</script>
<noscript><meta http-equiv="refresh" content="0; url=playback.html"></noscript>
</head>
<body><p>The Layout Lab is here: <a href="playback.html">open the Layout Lab</a>.</p></body>
