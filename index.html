<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ontology Layouts</title>
<meta name="description" content="Readable automatic layouts for ontology diagrams: an introduction, the Layout Playback, the Layout Lab, the benchmarks and a developer guide, in one page.">
<style>
:root { --bg: #f4f3ee; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15181c; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #15181c; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
iframe.on { display: block; }
</style>
</head>
<body>
<script src="site-nav.js" data-page="intro"></script>
<script>
// One link for the whole site: each page lives in its own frame, loaded the first time it is shown and kept, so switching
// back to the playback or the lab finds it as it was. The address is index.html#page, optionally :anchor (a section of that
// page) and ?query (handed to that page).
const PAGES = Object.fromEntries(SiteNav.pages.map((p) => [p[0], { name: p[1], src: p[3] }]));
const frames = {};
function show(page, query, anchor) {
  if (!PAGES[page]) page = 'intro';
  let f = frames[page];
  if (!f || (query && f.dataset.q !== query)) {
    if (!f) { f = document.createElement('iframe'); f.title = PAGES[page].name; frames[page] = f; document.body.appendChild(f); }
    f.dataset.q = query || ''; f.src = PAGES[page].src + (query || '') + (anchor ? '#' + anchor : '');
  } else if (anchor) { try { const el = f.contentDocument.getElementById(anchor); if (el) el.scrollIntoView(); else f.src = PAGES[page].src + (query || '') + '#' + anchor; } catch (e) {} }
  Object.values(frames).forEach((x) => x.classList.toggle('on', x === f));
  document.title = (page === 'intro' ? '' : PAGES[page].name + ' · ') + 'Ontology Layouts';
  const want = '#' + page + (anchor ? ':' + anchor : '') + (query || '');
  if (location.hash !== want) history.replaceState(null, '', want);
  try { f.contentWindow && f.contentWindow.focus(); } catch (e) {}
}
window.SiteShell = { show };
const fromHash = () => SiteNav.parse(location.hash.slice(1)); // index.html#page:anchor?query
window.addEventListener('hashchange', () => show(...fromHash()));
show(...fromHash());
</script>
</body>
</html>
